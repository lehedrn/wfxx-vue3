
# ==================== 全局默认配置 ====================
global:
  author: lihd                    # 作者
  packageName: com.ruoyi.demo    # 生成包路径
  moduleName: demo               # 模块名（默认从 packageName 提取末段）
  autoRemovePre: true              # 自动去除表前缀
  tablePrefix: demo_                # 表前缀（多个逗号分隔）
  tplCategory: crud                # 模板类型: crud / tree / sub
  tplWebType: element-plus         # 前端类型: element-ui / element-plus
  parentMenuId: 4                  # 上级菜单ID

# ==================== 表级配置 ====================
# 按表名配置，覆盖全局默认。每张表可配置：
#   基本信息：tableName, tableComment, className, functionAuthor, remark
#   生成信息：tplCategory, tplWebType, packageName, moduleName, businessName,
#            functionName, parentMenuId, treeCode, treeParentCode, treeName,
#            subTableName, subTableFkName
#   字段信息：columns 下按列名配置
tables:
  demo_product:
    # -- 基本信息 --
    className: Product              # 实体类名（默认自动转换）
    functionAuthor: lihd        # 覆盖全局 author
    remark: 产品管理模块

    # -- 生成信息 --
    tplCategory: tree
    tplWebType: element-plus
    packageName: com.ruoyi.demo  # 覆盖全局包名
    moduleName: demo
    businessName: product
    functionName: 产品管理
    parentMenuId: 4
    formColNum: 1

    # -- 树表配置 --
    treeCode: id
    treeParentCode: parent_id
    treeName: name

    # -- 字段信息（按列名配置） --
    columns:
      parent_id:
        isList: false
        isQuery: false
      order_num:
        columnComment: 显示顺序
        javaType: Integer
        javaField: orderNum
        isInsert: true
        isEdit: true
        isList: true
        isQuery: false
        isRequired: true
        queryType: EQ
        htmlType: input

      status:
        columnComment: 状态（0正常 1停用）
        javaType: String
        javaField: status
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: EQ
        htmlType: radio
        dictType: sys_common_status


