
# ==================== 全局默认配置 ====================
global:
  author: lihd                    # 作者
  packageName: com.ruoyi.demo    # 生成包路径
  moduleName: demo               # 模块名（默认从 packageName 提取末段）
  autoRemovePre: true              # 自动去除表前缀
  tablePrefix: demo_                # 表前缀（多个逗号分隔）
  tplCategory: crud                # 模板类型: crud / tree / sub
  tplWebType: element-plus         # 前端类型: element-ui / element-plus
  parentMenuId: 4                  # 上级菜单ID

# ==================== 表级配置 ====================
# 按表名配置，覆盖全局默认。每张表可配置：
#   基本信息：tableName, tableComment, className, functionAuthor, remark
#   生成信息：tplCategory, tplWebType, packageName, moduleName, businessName,
#            functionName, parentMenuId, treeCode, treeParentCode, treeName,
#            subTableName, subTableFkName
#   字段信息：columns 下按列名配置
tables:
  demo_student:
    # -- 基本信息 --
    className: Student              # 实体类名（默认自动转换）
    functionAuthor: lihd        # 覆盖全局 author
    remark: 学生管理模块

    # -- 生成信息 --
    tplCategory: crud
    tplWebType: element-plus
    packageName: com.ruoyi.demo  # 覆盖全局包名
    moduleName: demo
    businessName: student
    functionName: 学生管理
    parentMenuId: 4
    formColNum: 1

    # -- 字段信息（按列名配置） --
    columns:
      id:
        columnComment: 编号
        javaType: Long
        javaField: id
        isInsert: true
        isRequired: false
        queryType: EQ
        htmlType: input

      name:
        columnComment: 学生名称
        javaType: String
        javaField: name
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: LIKE
        htmlType: input

      age:
        columnComment: 年龄
        javaType: Integer
        javaField: age
        isInsert: false
        isEdit: false
        isList: true
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: input

      student_hobby:
        columnComment: 爱好（1钓鱼 2写作 3运动 4冥想 5音乐 6电影）
        javaType: String
        javaField: studentHobby
        isInsert: true
        isEdit: true
        isList: true
        isQuery: false
        isRequired: true
        queryType: EQ
        htmlType: checkbox
        dictType: user_hobby

      sex:
        columnComment: 性别（0男 1女 2未知）
        javaType: String
        javaField: sex
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: EQ
        htmlType: select
        dictType: sys_user_sex

      status:
        columnComment: 状态（0正常 1停用）
        javaType: String
        javaField: status
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: EQ
        htmlType: radio
        dictType: sys_common_status

      birthday:
        columnComment: 生日
        javaType: Date
        javaField: birthday
        isInsert: true
        isEdit: true
        isList: true
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: datetime

