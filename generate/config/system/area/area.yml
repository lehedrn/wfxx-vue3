# ==================== 全局默认配置 ====================
global:
  author: coderleehd
  packageName: com.ruoyi.system
  moduleName: system
  autoRemovePre: true
  tablePrefix: sys_
  tplCategory: tree  # 注意：必须使用小写（crud/tree/sub）
  tplWebType: element-plus
  parentMenuId: 1  # 系统管理

# ==================== 表级配置 ====================
tables:
  sys_area:
    className: Area
    functionAuthor: coderleehd
    functionName: 区划管理
    businessName: area
    formColNum: 1  # 单列表单
    tplCategory: tree  # 注意：必须使用小写
    tplWebType: element-plus
    packageName: com.ruoyi.system
    moduleName: system
    parentMenuId: 1

    # 树形字段配置
    treeCode: code
    treeParentCode: parent_code
    treeName: name

    columns:
      name:
        columnComment: 区划名称
        javaType: String
        javaField: name
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: LIKE
        htmlType: input
      code:
        columnComment: 区划编码（2/4/6/9/12位）
        javaType: String
        javaField: code
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: LIKE
        htmlType: input
      parent_code:
        columnComment: 父区域编码（0 为根节点）
        javaType: String
        javaField: parentCode
        isInsert: true
        isEdit: true
        isList: false
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: treeselect
      ancestors:
        columnComment: 祖级列表
        javaType: String
        javaField: ancestors
        isInsert: false
        isEdit: false
        isList: false
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: input
      area_level:
        columnComment: 层级
        javaType: String
        javaField: areaLevel
        isInsert: true
        isEdit: true
        isList: true
        isQuery: true
        isRequired: true
        queryType: EQ
        htmlType: radio
        dictType: sys_area_level
      sort:
        columnComment: 排序号
        javaType: Integer
        javaField: sort
        isInsert: true
        isEdit: true
        isList: true
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: input
      remark:
        columnComment: 备注
        javaType: String
        javaField: remark
        isInsert: true
        isEdit: true
        isList: false
        isQuery: false
        isRequired: false
        queryType: EQ
        htmlType: textarea

    # 注意：以下字段不配置在 columns 中，代码生成器会自动处理
    # del_flag：新增时 Service 层设置 delFlag = "0"
    #          查询时 Mapper 添加 del_flag = '0' 过滤
    #          删除时使用 UPDATE 逻辑删除（del_flag = '1'）
    # create_time/update_time/create_by/update_by：审计字段
